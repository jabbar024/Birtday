    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script>
        const AUDIO_STORAGE_KEYS = {
            playing: 'birthday-audio-playing',
            time: 'birthday-audio-time',
            volume: 'birthday-audio-volume'
        };

        // Play birthday song
        const audio = document.getElementById('birthday-song');
        const playPauseBtn = document.getElementById('play-pause');
        const volumeControl = document.getElementById('volume');
        const menuToggle = document.getElementById('menuToggle');
        const closeMenu = document.getElementById('closeMenu');
        const mobileDrawer = document.getElementById('mobileDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        let isPlaying = false;
        let shouldKeepPlaying = localStorage.getItem(AUDIO_STORAGE_KEYS.playing) !== 'false';
        const isMobileView = window.matchMedia('(max-width: 768px)').matches;
        const floatingElementCount = isMobileView ? 32 : 72;
        const floatingElementInterval = isMobileView ? 9000 : 5000;
        let savedTimeApplied = false;

        function setDrawerState(isOpen) {
            mobileDrawer.classList.toggle('open', isOpen);
            drawerOverlay.classList.toggle('open', isOpen);
            menuToggle.setAttribute('aria-expanded', String(isOpen));
            document.body.style.overflowY = isOpen ? 'hidden' : 'auto';
        }

        menuToggle.addEventListener('click', () => setDrawerState(true));
        closeMenu.addEventListener('click', () => setDrawerState(false));
        drawerOverlay.addEventListener('click', () => setDrawerState(false));

        function persistAudioState() {
            localStorage.setItem(AUDIO_STORAGE_KEYS.time, String(audio.currentTime || 0));
            localStorage.setItem(AUDIO_STORAGE_KEYS.volume, String(audio.volume));
            localStorage.setItem(AUDIO_STORAGE_KEYS.playing, String(shouldKeepPlaying));
        }

        function syncAudioButton() {
            isPlaying = !audio.paused;
            playPauseBtn.innerHTML = isPlaying
                ? '<i class="play-icon">⏸️</i>'
                : '<i class="play-icon">▶️</i>';
        }

        function tryResumeAudio() {
            if (!shouldKeepPlaying) {
                syncAudioButton();
                return;
            }

            audio.play()
                .then(() => {
                    shouldKeepPlaying = true;
                    syncAudioButton();
                    persistAudioState();
                })
                .catch(error => {
                    console.log('Audio play failed due to autoplay restrictions:', error);
                    syncAudioButton();
                });
        }

        function enableAudioOnFirstInteraction() {
            const unlockAudio = () => {
                if (!audio.paused) {
                    return;
                }
                shouldKeepPlaying = true;
                tryResumeAudio();
            };

            ['click', 'touchstart', 'keydown'].forEach((eventName) => {
                document.addEventListener(eventName, unlockAudio, { once: true, passive: true });
            });
        }

        const savedVolume = localStorage.getItem(AUDIO_STORAGE_KEYS.volume);
        audio.volume = savedVolume ? Number(savedVolume) : Number(volumeControl.value);
        volumeControl.value = String(audio.volume);

        audio.addEventListener('loadedmetadata', () => {
            if (savedTimeApplied) {
                return;
            }

            const savedTime = Number(localStorage.getItem(AUDIO_STORAGE_KEYS.time) || 0);
            if (savedTime > 0 && savedTime < audio.duration) {
                audio.currentTime = savedTime;
            }
            savedTimeApplied = true;
            tryResumeAudio();
        });

        audio.addEventListener('play', syncAudioButton);
        audio.addEventListener('pause', syncAudioButton);
        audio.addEventListener('timeupdate', persistAudioState);
        window.addEventListener('pagehide', persistAudioState);
        window.addEventListener('beforeunload', persistAudioState);

        window.addEventListener('load', () => {
            if (audio.readyState >= 1 && !savedTimeApplied) {
                const savedTime = Number(localStorage.getItem(AUDIO_STORAGE_KEYS.time) || 0);
                if (savedTime > 0 && (!audio.duration || savedTime < audio.duration)) {
                    audio.currentTime = savedTime;
                }
                savedTimeApplied = true;
            }
            tryResumeAudio();
        });
        enableAudioOnFirstInteraction();

        // Play/Pause button
        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                shouldKeepPlaying = false;
                audio.pause();
            } else {
                shouldKeepPlaying = true;
                audio.play();
            }
            syncAudioButton();
            persistAudioState();
        });

        // Volume control
        volumeControl.addEventListener('input', () => {
            audio.volume = volumeControl.value;
            persistAudioState();
        });

        // Function to go to next page
        function goToNextPage() {
            // Add a bounce effect before navigating
            gsap.to('.next-button', {
                scale: 1.2,
                yoyo: true,
                repeat: 1,
                duration: 0.3,
                onComplete: () => {
                    // Change this URL to your next page
                    window.location.href = "memorylane.html";
                    
                    // For demonstration, we'll just show an alert
                    
                }
            });
        }

        // Create confetti, balloons, hearts, and stars
        function createFloatingElements() {
            const colors = ['#FF1493', '#8A2BE2', '#FFD700', '#FF4500', '#00BFFF', '#32CD32'];
            const elements = ['confetti', 'balloon', 'heart', 'star'];
            const confettiShapes = ['▲', '■', '●', '★', '♥', '♦', '✦', '✧'];
            
            for (let i = 0; i < floatingElementCount; i++) {
                setTimeout(() => {
                    const element = document.createElement('div');
                    
                    // Randomly pick an element type
                    const elementType = elements[Math.floor(Math.random() * elements.length)];
                    element.className = elementType;
                    
                    // Set random position
                    element.style.left = Math.random() * 100 + 'vw';
                    element.style.top = -30 + 'px';
                    
                    // Set random color
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Different styling based on element type
                    if (elementType === 'confetti') {
                        const shape = confettiShapes[Math.floor(Math.random() * confettiShapes.length)];
                        element.innerHTML = shape;
                        element.style.color = color;
                        element.style.fontSize = (Math.random() * 20 + 10) + 'px';
                        element.style.transform = `rotate(${Math.random() * 360}deg)`;
                    } else if (elementType === 'balloon') {
                        element.innerHTML = '🎈';
                        element.style.fontSize = (Math.random() * 30 + 20) + 'px';
                        element.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
                    } else if (elementType === 'heart') {
                        element.innerHTML = '❤️';
                        element.style.fontSize = (Math.random() * 20 + 10) + 'px';
                        element.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
                    } else if (elementType === 'star') {
                        element.innerHTML = '✨';
                        element.style.fontSize = (Math.random() * 15 + 10) + 'px';
                    }
                    
                    // Add to body
                    document.body.appendChild(element);
                    
                    // Animate with GSAP
                    gsap.to(element, {
                        y: window.innerHeight + 100,
                        x: '+=' + (Math.random() * 200 - 100),
                        rotation: Math.random() * 360,
                        duration: Math.random() * 10 + 5,
                        ease: "power1.out",
                        onComplete: () => {
                            document.body.removeChild(element);
                        }
                    });
                    
                    // Add some sparkle animation
                    if (Math.random() > 0.7) {
                        gsap.to(element, {
                            opacity: 0.5,
                            yoyo: true,
                            repeat: -1,
                            duration: 0.5,
                            ease: "sine.inOut"
                        });
                    }
                    
                }, i * 180); // Staggered start times
            }
        }

        // Start floating elements on load
        window.addEventListener('load', createFloatingElements);
        
        // Create new elements periodically
        setInterval(createFloatingElements, floatingElementInterval);
        
        // Add a subtle sparkle effect to the heading
        gsap.to('h1', {
            textShadow: "0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 20, 147, 0.6)",
            repeat: -1,
            yoyo: true,
            duration: 2
        });
        
        // Responsive adjustments
        function handleResize() {
            // Add responsive adjustments if needed
        }
        
        window.addEventListener('resize', handleResize);
        handleResize();
    </script>

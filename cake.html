    <style>
      :root {
        --touch-size: 44px;
      }

      /* Global Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial Rounded MT Bold", "Helvetica Rounded", Arial,
          sans-serif;
      }

      body {
        background: linear-gradient(135deg, #ffcce6, #c4e0ff);
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        overflow-y: auto;
        position: relative;
        padding: 5rem 1rem 7rem;
      }

      /* Floating Balloons */
      .balloon {
        position: absolute;
        width: 40px;
        height: 50px;
        border-radius: 50%;
        animation: float 15s infinite ease-in-out;
        z-index: 1;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateY(-100px) translateX(50px);
          opacity: 0;
        }
      }

      /* Confetti */
      .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #ffcc00;
        opacity: 0;
        animation: confettiFall 5s infinite ease-out;
        z-index: 1;
      }

      @keyframes confettiFall {
        0% {
          transform: translateY(-10vh) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }

      /* Birthday Cake Container */
      .cake-container {
        position: relative;
        width: min(78vw, 18.75rem);
        height: min(78vw, 18.75rem);
        margin: 20px auto;
        z-index: 10;
      }

      /* Cake Base */
      .cake {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(66vw, 12.5rem);
        height: clamp(5rem, 24vw, 7.5rem);
        background: linear-gradient(to right, #ff85a2, #ff99b6);
        border-radius: 10px 10px 0 0;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .cake:before {
        content: "";
        position: absolute;
        top: -40px;
        left: 0;
        width: 100%;
        height: 40px;
        background: linear-gradient(to right, #fc6c85, #ff85a2);
        border-radius: 10px 10px 0 0;
      }

      .cake:after {
        content: "";
        position: absolute;
        top: -70px;
        left: 10%;
        width: 80%;
        height: 30px;
        background: linear-gradient(to right, #ffb3c6, #ffcce6);
        border-radius: 10px 10px 0 0;
      }

      /* Frosting & Decorations */
      .frosting {
        position: absolute;
        top: -75px;
        left: 15%;
        width: 70%;
        height: 5px;
        background: #ffffff;
        border-radius: 5px;
        box-shadow: 0 0 5px #ffcce6;
      }

      .decoration {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff3366;
        box-shadow: 0 0 5px #ff99b6;
      }

      /* Candles */
      .candle-container {
        position: absolute;
        top: -95px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 20px;
        z-index: 15;
      }

      .candle {
        position: relative;
        width: 8px;
        height: 30px;
        background: linear-gradient(to top, #ffff99, #ff9933);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
        touch-action: manipulation;
      }

      .flame {
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: 12px;
        height: 20px;
        background: radial-gradient(
          ellipse at center,
          #ffff00,
          #ff9900,
          #ff6600
        );
        border-radius: 50% 50% 20% 20%;
        box-shadow: 0 0 10px #ff9900, 0 0 20px #ffff00;
        opacity: 1;
        animation: flicker 0.5s infinite alternate;
        z-index: 20;
      }

      @keyframes flicker {
        0% {
          transform: translateX(-50%) scale(1);
          opacity: 1;
        }
        100% {
          transform: translateX(-50%) scale(1.1);
          opacity: 0.9;
        }
      }

      .candle.blown .flame {
        opacity: 0;
        animation: none;
        transition: opacity 0.3s ease-out;
      }

      .smoke {
        position: absolute;
        top: -25px;
        left: 50%;
        transform: translateX(-50%);
        width: 8px;
        height: 0;
        background: rgba(200, 200, 200, 0.5);
        border-radius: 10px;
        opacity: 0;
        transition: all 0.5s ease;
      }

      .candle.blown .smoke {
        height: 30px;
        opacity: 0.7;
        animation: smokeRise 2s forwards;
      }

      @keyframes smokeRise {
        0% {
          height: 0;
          opacity: 0;
        }
        20% {
          height: 10px;
          opacity: 0.7;
        }
        100% {
          height: 30px;
          opacity: 0;
          transform: translateX(-50%) translateY(-30px) scale(1.5);
        }
      }

      /* Sparkles */
      .sparkle {
        position: absolute;
        width: 4px;
        height: 4px;
        background-color: #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 5px #ffff99;
        opacity: 0;
        z-index: 12;
      }

      @keyframes sparkle {
        0% {
          transform: scale(0) rotate(0deg);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: scale(1.5) rotate(90deg);
          opacity: 0;
        }
      }

      /* Enhanced Wish Message */
      .wish-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: rgba(255, 255, 255, 0.95);
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(255, 105, 180, 0.8),
          0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 51, 102, 0.4);
        text-align: center;
        z-index: 100;
        opacity: 0;
        width: 90%;
        max-width: 400px;
        transition: all 0.5s ease;
        border: 3px solid rgba(255, 255, 255, 0.7);
      }

      .wish-message.show {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
        animation: bounceIn 0.8s;
      }

      @keyframes bounceIn {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0;
        }
        60% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
      }

      .wish-message h2 {
        color: #ff3366;
        font-size: 28px;
        margin-bottom: 15px;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
        background: linear-gradient(45deg, #ff3366, #ff66b3);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .wish-message p {
        color: #333;
        font-size: 20px;
        margin-bottom: 20px;
        line-height: 1.5;
        font-weight: 500;
      }

      /* Fireworks */
      .firework {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        opacity: 0;
        z-index: 5;
      }

      @keyframes firework {
        0% {
          transform: scale(0);
          opacity: 1;
          box-shadow: 0 0 0 0px rgba(255, 255, 255, 0.9),
            0 0 0 0px rgba(255, 0, 102, 0.9), 0 0 0 0px rgba(255, 255, 0, 0.9),
            0 0 0 0px rgba(51, 204, 255, 0.9);
        }
        100% {
          transform: scale(1);
          opacity: 0;
          box-shadow: 0 0 0 50px rgba(255, 255, 255, 0),
            0 0 0 100px rgba(255, 0, 102, 0), 0 0 0 150px rgba(255, 255, 0, 0),
            0 0 0 200px rgba(51, 204, 255, 0);
        }
      }

      /* Navigation Buttons */
      .nav-buttons {
        position: fixed;
        bottom: 30px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0 1rem;
        z-index: 50;
      }

      .btn {
        min-height: var(--touch-size);
        padding: 0.85rem 1.25rem;
        background: linear-gradient(to right, #ff85a2, #ff3366);
        color: white;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
        transition: all 0.3s ease;
        outline: none;
      }

      @media (hover: hover) {
        .btn:hover {
          transform: translateY(-3px);
          box-shadow: 0 8px 20px rgba(255, 51, 102, 0.6);
        }
      }

      .btn:active {
        transform: translateY(-1px);
        box-shadow: 0 5px 10px rgba(255, 51, 102, 0.4);
      }

      .mobile-topbar {
        position: fixed;
        top: max(0.75rem, env(safe-area-inset-top));
        right: 1rem;
        z-index: 120;
        display: none;
      }

      .menu-toggle {
        min-width: var(--touch-size);
        min-height: var(--touch-size);
        padding: 0.75rem 0.9rem;
        border: none;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        color: #ff3366;
        box-shadow: 0 0.5rem 1.5rem rgba(255, 51, 102, 0.18);
        font-weight: 700;
        cursor: pointer;
      }

      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(41, 8, 26, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 110;
      }

      .mobile-drawer {
        position: fixed;
        top: 0;
        right: 0;
        width: min(82vw, 18rem);
        height: 100vh;
        height: 100svh;
        padding: max(1rem, env(safe-area-inset-top)) 1rem 1.5rem;
        background: rgba(255, 255, 255, 0.97);
        box-shadow: -1rem 0 2.5rem rgba(0, 0, 0, 0.15);
        transform: translateX(100%);
        transition: transform 0.25s ease;
        z-index: 115;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .drawer-overlay.open,
      .mobile-drawer.open {
        opacity: 1;
        pointer-events: auto;
      }

      .mobile-drawer.open {
        transform: translateX(0);
      }

      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.5rem;
      }

      .drawer-link {
        display: flex;
        align-items: center;
        min-height: var(--touch-size);
        padding: 0.9rem 1rem;
        border-radius: 1rem;
        color: #ff3366;
        text-decoration: none;
        background: rgba(255, 204, 230, 0.8);
        font-weight: 700;
      }

      .music-controls {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 120;
        width: 50px;
        height: 50px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.88);
        color: #ff3366;
        box-shadow: 0 0.5rem 1.5rem rgba(255, 51, 102, 0.18);
        font-size: 1.25rem;
        cursor: pointer;
      }

      /* Improved Responsive Design */
      @media (max-width: 768px) {
        .mobile-topbar {
          display: block;
        }

        body {
          justify-content: flex-start;
        }

        .cake-container {
          width: 250px;
          height: 250px;
        }

        .cake {
          width: 160px;
          height: 90px;
        }

        .candle-container {
          gap: 15px;
        }

        .wish-message h2 {
          font-size: 24px;
        }

        .wish-message p {
          font-size: 18px;
        }

        .nav-buttons {
          padding: 0 20px;
          bottom: 20px;
        }

        .btn {
          padding: 10px 18px;
          font-size: 15px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding-inline: 0.75rem;
        }

        .cake-container {
          width: 200px;
          height: 200px;
          margin: 10px auto;
        }

        .cake {
          width: 130px;
          height: 80px;
        }

        .candle-container {
          gap: 12px;
          top: -85px;
        }

          width: 6px;
          height: 25px;
        }

        .wish-message {
          width: 85%;
          padding: 20px;
        }

        .wish-message h2 {
          font-size: 22px;
          margin-bottom: 10px;
        }

        .wish-message p {
          font-size: 16px;
          margin-bottom: 15px;
        }

        .nav-buttons {
          display: grid;
          grid-template-columns: 1fr;
          padding: 0 0.75rem;
          bottom: 15px;
        }

        .btn {
          font-size: 14px;
          white-space: nowrap;
          width: 100%;
        }
      }

      /* Extra small devices */
      @media (max-width: 360px) {
        .cake-container {
          width: 180px;
          height: 180px;
        }

        .cake {
          width: 110px;
          height: 70px;
        }

          gap: 10px;
        }

        .wish-message {
          width: 90%;
          padding: 15px;
        }

        .wish-message h2 {
          font-size: 20px;
        }

        .wish-message p {
          font-size: 14px;
        }

        .nav-buttons {
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }

        .btn {
          width: 100%;
          text-align: center;
          font-size: 13px;
        }
      }

      @media (max-width: 375px) {
        .wish-message h2 {
          font-size: 1.2rem;
        }

        .wish-message p {
          font-size: 0.95rem;
        }
      }

      @media (max-width: 320px) {
        .cake-container {
          width: 170px;
          height: 170px;
        }
      }

      // Global variables
      let candlesBlown = 0;
      const totalCandles = 5;
      let allCandlesBlown = false;
      const supportsHover = window.matchMedia("(hover: hover)").matches;

      // Initialize the page when it loads
      document.addEventListener("DOMContentLoaded", function () {
        const AUDIO_STORAGE_KEYS = {
          playing: "birthday-audio-playing",
          time: "birthday-audio-time",
          volume: "birthday-audio-volume",
        };
        const menuToggle = document.getElementById("menuToggle");
        const closeMenu = document.getElementById("closeMenu");
        const mobileDrawer = document.getElementById("mobileDrawer");
        const drawerOverlay = document.getElementById("drawerOverlay");
        const musicToggle = document.getElementById("music-toggle");
        const backgroundMusic = document.getElementById("background-music");
        let savedTimeApplied = false;
        let shouldKeepPlaying =
          localStorage.getItem(AUDIO_STORAGE_KEYS.playing) !== "false";

        function setDrawerState(isOpen) {
          mobileDrawer.classList.toggle("open", isOpen);
          drawerOverlay.classList.toggle("open", isOpen);
          menuToggle.setAttribute("aria-expanded", String(isOpen));
          document.body.style.overflowY = isOpen ? "hidden" : "auto";
        }

        function persistAudioState() {
          localStorage.setItem(
            AUDIO_STORAGE_KEYS.time,
            String(backgroundMusic.currentTime || 0)
          );
          localStorage.setItem(
            AUDIO_STORAGE_KEYS.volume,
            String(backgroundMusic.volume)
          );
          localStorage.setItem(
            AUDIO_STORAGE_KEYS.playing,
            String(shouldKeepPlaying)
          );
        }

        function syncMusicButton() {
          musicToggle.textContent = backgroundMusic.paused ? "▶" : "⏸";
        }

        function tryResumeAudio() {
          if (!shouldKeepPlaying) {
            syncMusicButton();
            return;
          }

          backgroundMusic.play().then(() => {
            shouldKeepPlaying = true;
            syncMusicButton();
            persistAudioState();
          }).catch((error) => {
            console.log("Audio play error:", error);
            syncMusicButton();
          });
        }

        function enableAudioOnFirstInteraction() {
          const unlockAudio = () => {
            if (!backgroundMusic.paused) {
              return;
            }
            shouldKeepPlaying = true;
            tryResumeAudio();
          };

          ["click", "touchstart", "keydown"].forEach((eventName) => {
            document.addEventListener(eventName, unlockAudio, {
              once: true,
              passive: true,
            });
          });
        }

        menuToggle.addEventListener("click", () => setDrawerState(true));
        closeMenu.addEventListener("click", () => setDrawerState(false));
        drawerOverlay.addEventListener("click", () => setDrawerState(false));

        const savedVolume = localStorage.getItem(AUDIO_STORAGE_KEYS.volume);
        backgroundMusic.volume = savedVolume ? Number(savedVolume) : 0.5;

        backgroundMusic.addEventListener("loadedmetadata", () => {
          if (savedTimeApplied) {
            return;
          }

          const savedTime = Number(
            localStorage.getItem(AUDIO_STORAGE_KEYS.time) || 0
          );
          if (savedTime > 0 && savedTime < backgroundMusic.duration) {
            backgroundMusic.currentTime = savedTime;
          }
          savedTimeApplied = true;
          tryResumeAudio();
        });

        backgroundMusic.addEventListener("play", syncMusicButton);
        backgroundMusic.addEventListener("pause", syncMusicButton);
        backgroundMusic.addEventListener("timeupdate", persistAudioState);
        window.addEventListener("pagehide", persistAudioState);
        window.addEventListener("beforeunload", persistAudioState);

        musicToggle.addEventListener("click", () => {
          if (backgroundMusic.paused) {
            shouldKeepPlaying = true;
            backgroundMusic.play().catch((error) => {
              console.log("Audio play error:", error);
            });
          } else {
            shouldKeepPlaying = false;
            backgroundMusic.pause();
          }
          syncMusicButton();
          persistAudioState();
        });

        tryResumeAudio();
        enableAudioOnFirstInteraction();

        createCandles();
        createBalloons();
        createConfetti();
        createDecorations();

        // Add event listeners for candle interaction
        document.querySelectorAll(".candle").forEach((candle) => {
          candle.addEventListener("click", blowOutCandle);
          candle.addEventListener("touchstart", blowOutCandle); // Better for mobile
          if (supportsHover) {
            candle.addEventListener("mouseover", function (e) {
              if (e.buttons === 0) {
                blowOutCandle.call(this);
              }
            });
          }
        });

        // For better mobile experience with touch
        document.addEventListener("touchmove", function (e) {
          const touch = e.touches[0];
          const element = document.elementFromPoint(
            touch.clientX,
            touch.clientY
          );
          if (
            element &&
            element.classList.contains("candle") &&
            !element.classList.contains("blown")
          ) {
            blowOutCandle.call(element);
          }
        });

        // Optional: Listen for keyboard input
        document.addEventListener("keypress", function (e) {
          if (e.key === "b" || e.key === "B") {
            // Press 'b' to simulate blowing
            blowRandomCandle();
          }
        });
      });

      // Create candles for the cake
      function createCandles() {
        const candleContainer = document.getElementById("candleContainer");

        for (let i = 0; i < totalCandles; i++) {
          const candle = document.createElement("div");
          candle.className = "candle";

          const flame = document.createElement("div");
          flame.className = "flame";

          const smoke = document.createElement("div");
          smoke.className = "smoke";

          candle.appendChild(flame);
          candle.appendChild(smoke);
          candleContainer.appendChild(candle);
        }
      }

      // Create floating balloons
      function createBalloons() {
        const colors = ["#ff66b3", "#66ccff", "#ff9966", "#99ff66", "#cc99ff"];
        const numBalloons = window.matchMedia("(max-width: 768px)").matches
          ? 8
          : 15;

        for (let i = 0; i < numBalloons; i++) {
          const balloon = document.createElement("div");
          balloon.className = "balloon";
          balloon.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          balloon.style.left = `${Math.random() * 100}%`;
          balloon.style.animationDuration = `${15 + Math.random() * 10}s`;
          balloon.style.animationDelay = `${Math.random() * 5}s`;
          document.body.appendChild(balloon);
        }
      }

      // Create confetti pieces
      function createConfetti() {
        const colors = ["#ffcc00", "#ff66b3", "#66ccff", "#ff9966", "#99ff66"];
        const numConfetti = window.matchMedia("(max-width: 768px)").matches
          ? 24
          : 50;

        for (let i = 0; i < numConfetti; i++) {
          const confetti = document.createElement("div");
          confetti.className = "confetti";
          confetti.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          confetti.style.left = `${Math.random() * 100}%`;
          confetti.style.width = `${5 + Math.random() * 5}px`;
          confetti.style.height = `${5 + Math.random() * 10}px`;
          confetti.style.animationDuration = `${3 + Math.random() * 4}s`;
          confetti.style.animationDelay = `${Math.random() * 5}s`;
          document.body.appendChild(confetti);
        }
      }

      // Create cake decorations
      function createDecorations() {
        const cake = document.querySelector(".cake");
        const colors = ["#ff3366", "#ffcc00", "#66ccff", "#ff9966", "#99ff66"];
        const numDecorations = 10;

        for (let i = 0; i < numDecorations; i++) {
          const decoration = document.createElement("div");
          decoration.className = "decoration";
          decoration.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          decoration.style.top = `${-20 - Math.random() * 50}px`;
          decoration.style.left = `${Math.random() * 100}%`;
          cake.appendChild(decoration);
        }
      }

      // Blow out a candle when clicked or hovered
      function blowOutCandle() {
        if (!this.classList.contains("blown")) {
          this.classList.add("blown");
          candlesBlown++;

          // Create sparkle effect
          createSparkleEffect(this);

          // Check if all candles are blown
          if (candlesBlown === totalCandles && !allCandlesBlown) {
            allCandlesBlown = true;
            setTimeout(showWishMessage, 1000);
          }
        }
      }

      // Simulate blowing a random candle
      function blowRandomCandle() {
        const unblownCandles = Array.from(
          document.querySelectorAll(".candle:not(.blown)")
        );
        if (unblownCandles.length > 0) {
          const randomCandle =
            unblownCandles[Math.floor(Math.random() * unblownCandles.length)];
          blowOutCandle.call(randomCandle);
        }
      }

      // Create sparkle effect around the blown candle
      function createSparkleEffect(candle) {
        const numSparkles = 10;
        const candleRect = candle.getBoundingClientRect();

        for (let i = 0; i < numSparkles; i++) {
          const sparkle = document.createElement("div");
          sparkle.className = "sparkle";
          sparkle.style.left = `${
            candleRect.left + Math.random() * candleRect.width
          }px`;
          sparkle.style.top = `${
            candleRect.top + Math.random() * (candleRect.height / 2)
          }px`;
          sparkle.style.animation = `sparkle ${
            0.5 + Math.random() * 0.5
          }s forwards`;
          document.body.appendChild(sparkle);

          // Remove sparkle after animation
          setTimeout(() => {
            sparkle.remove();
          }, 1000);
        }
      }

      // Show the wish message when all candles are blown
      function showWishMessage() {
        document.getElementById("wishMessage").classList.add("show");
        createFireworks();
      }

      // Close the wish message
      function closeWishMessage() {
        document.getElementById("wishMessage").classList.remove("show");
      }

      // Create fireworks effect
      function createFireworks() {
        const numFireworks = 10;
        const colors = ["#ff3366", "#ffcc00", "#66ccff", "#ff9966", "#99ff66"];

        for (let i = 0; i < numFireworks; i++) {
          setTimeout(() => {
            const firework = document.createElement("div");
            firework.className = "firework";
            firework.style.left = `${10 + Math.random() * 80}%`;
            firework.style.top = `${10 + Math.random() * 60}%`;
            firework.style.backgroundColor =
              colors[Math.floor(Math.random() * colors.length)];
            firework.style.animation = `firework ${
              1 + Math.random()
            }s forwards`;
            document.body.appendChild(firework);

            // Remove firework after animation
            setTimeout(() => {
              firework.remove();
            }, 2000);
          }, i * 300);
        }
      }

      // Navigation functions
      function goBack() {
        // Replace with actual back URL

        window.location.href = "memorylane.html";
      }

      function goNext() {
        // Replace with actual next URL

        window.location.href = "letter.html";
      }
    </script>

    </body>

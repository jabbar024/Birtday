<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise For You ✨</title>
    <style>
        :root {
            --touch-size: 44px;
            --content-width: min(100%, 50rem);
            --space-md: clamp(1rem, 3vw, 1.25rem);
            --space-lg: clamp(1.25rem, 4vw, 2rem);
        }

        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8e1f4, #e0c3f7, #c2e6ff);
            background-size: 400% 400%;
            animation: gradientBackground 15s ease infinite;
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            position: relative;
            padding: 5rem 0 6rem;
        }

        .container {
            max-width: 50rem;
            width: var(--content-width);
            margin: 0 auto;
            padding: var(--space-md);
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 3s forwards 0.5s;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        h1 {
            font-size: clamp(1.85rem, 6vw, 2.75rem);
            color: #6a4c93;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            line-height: 1.15;
        }

        /* Letter Section */
        .letter-container {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: clamp(0.9rem, 3vw, 1.5rem);
            box-shadow: 0 0 20px rgba(106, 76, 147, 0.3);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            max-width: 38rem;
            margin-left: auto;
            margin-right: auto;
        }

        .letter-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            box-shadow: inset 0 0 15px rgba(255, 215, 232, 0.7);
            pointer-events: none;
            z-index: 1;
        }

        .letter {
            font-size: clamp(0.95rem, 2.3vw, 1.08rem);
            line-height: 1.95;
            color: #c6285b;
            position: relative;
            z-index: 2;
            min-height: 170px;
            direction: rtl;
            unicode-bidi: plaintext;
            text-align: right;
            white-space: pre-wrap;
        }

        .typed-cursor {
            direction: rtl;
        }

        .video-container {
            display: none;
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            margin-bottom: 40px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(106, 76, 147, 0.3), 0 0 30px rgba(255, 215, 232, 0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Back Button */
        .back-button {
            display: inline-block;
            margin-top: 20px;
            min-height: var(--touch-size);
            padding: 0.8rem 1.25rem;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #6a4c93;
            color: #6a4c93;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        @media (hover: hover) {
            .back-button:hover {
                background: #6a4c93;
                color: white;
            }
        }

        /* Floating Elements */
        .floating-element {
            position: absolute;
            pointer-events: none;
            opacity: 0.7;
            z-index: 1;
            animation-name: float;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        /* Music Controls */
        .music-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(106, 76, 147, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        @media (hover: hover) {
            .music-controls:hover {
                transform: scale(1.1);
            }
        }

        .music-controls i {
            color: #6a4c93;
            font-size: 24px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradientBackground {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes gradientButton {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* Cursor Effect */
        .cursor-effect {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.7);
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        .mobile-topbar {
            position: fixed;
            top: max(0.75rem, env(safe-area-inset-top));
            right: 1rem;
            z-index: 120;
            display: none;
        }

        .menu-toggle {
            min-width: var(--touch-size);
            min-height: var(--touch-size);
            padding: 0.75rem 0.9rem;
            border: none;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            color: #6a4c93;
            box-shadow: 0 0.5rem 1.5rem rgba(106, 76, 147, 0.18);
            font-weight: 700;
            cursor: pointer;
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(29, 16, 58, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 110;
        }

        .mobile-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: min(82vw, 18rem);
            height: 100vh;
            height: 100svh;
            padding: max(1rem, env(safe-area-inset-top)) 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: -1rem 0 2.5rem rgba(0, 0, 0, 0.15);
            transform: translateX(100%);
            transition: transform 0.25s ease;
            z-index: 115;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .drawer-overlay.open,
        .mobile-drawer.open {
            opacity: 1;
            pointer-events: auto;
        }

        .mobile-drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .drawer-link {
            display: flex;
            align-items: center;
            min-height: var(--touch-size);
            padding: 0.9rem 1rem;
            border-radius: 1rem;
            color: #6a4c93;
            text-decoration: none;
            background: rgba(224, 195, 247, 0.35);
            font-weight: 700;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .mobile-topbar {
                display: block;
            }

            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 15px;
            }

            .letter-container {
                padding: 20px;
            }

            .letter {
                font-size: 1rem;
            }

            .floating-element {
                max-width: 40px;
                max-height: 40px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding-top: 5rem;
            }

            .music-controls {
                right: 12px;
                bottom: 12px;
            }
        }

        @media (max-width: 375px) {
        }

        @media (max-width: 320px) {
            .container {
                padding: 0.75rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="mobileDrawer" aria-label="Open navigation menu">Menu</button>
    </div>

    <div class="drawer-overlay" id="drawerOverlay"></div>

    <nav class="mobile-drawer" id="mobileDrawer" aria-label="Mobile navigation">
        <div class="drawer-header">
            <strong>Birthday Pages</strong>
            <button class="menu-toggle" id="closeMenu" type="button" aria-label="Close navigation menu">Close</button>
        </div>
        <a class="drawer-link" href="index.html">Welcome</a>
        <a class="drawer-link" href="memorylane.html">Memory Lane</a>
        <a class="drawer-link" href="cake.html">Cake</a>
        <a class="drawer-link" href="letter.html">Letter</a>
    </nav>

    <div class="container">
        <header>
            <h1>❤️ For My ❤️<br> ❤️ Shareek-e-hayat ❤️</h1>
        </header>

        <div class="letter-container">
            <div class="letter" id="typed-text"></div>
        </div>

        <div class="video-container" id="video-message">
            <!-- Replace with your video embed code -->
            <iframe src="about:blank" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="navigation">
            <a href="javascript:history.back()" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to Birthday Cake
            </a>
        </div>
    </div>

    <!-- Music Controls -->
    <div class="music-controls" id="music-toggle">
        <i class="fas fa-volume-mute" id="music-icon"></i>
    </div>

    <audio id="background-music" loop autoplay>
        <source src="soulmate-ek-tha-raja-320-kbps_7NxokCc9.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const AUDIO_STORAGE_KEYS = {
                playing: 'birthday-audio-playing',
                time: 'birthday-audio-time',
                volume: 'birthday-audio-volume'
            };
            const menuToggle = document.getElementById('menuToggle');
            const closeMenu = document.getElementById('closeMenu');
            const mobileDrawer = document.getElementById('mobileDrawer');
            const drawerOverlay = document.getElementById('drawerOverlay');
            const supportsHover = window.matchMedia('(hover: hover)').matches;

            function setDrawerState(isOpen) {
                mobileDrawer.classList.toggle('open', isOpen);
                drawerOverlay.classList.toggle('open', isOpen);
                menuToggle.setAttribute('aria-expanded', String(isOpen));
                document.body.style.overflowY = isOpen ? 'hidden' : 'auto';
            }

            menuToggle.addEventListener('click', () => setDrawerState(true));
            closeMenu.addEventListener('click', () => setDrawerState(false));
            drawerOverlay.addEventListener('click', () => setDrawerState(false));

            // Fade in animation
            setTimeout(() => {
                document.querySelector('.container').style.opacity = 1;
            }, 500);

            // Typewriter effect for letter
            const letterContent = `تم میری دعاوں کا حاصل ہو،
میرے خوابوں کی تعبیر ہو تم۔
میری خاموشی کی زبان ہو،
میرے دل کی ہر تصویر ہو تم۔

جب بھی سوچوں میں کھو جاتا ہوں،
ہر خیال میں بس تم آتی ہو،
میرے دن کی پہلی روشنی،
اور رات کی آخری باتی ہو۔

تمہاری ہنسی میں وہ جادو ہے،
جو ہر غم کو بھلا دیتا ہے،
تمہاری ایک نظر ہی کافی ہے،
جو دل کو سکون دلا دیتا ہے۔

میں نے رب سے مانگا تھا سکون،
اس نے تمہیں میری قسمت بنا دیا،
میں نے چاہا تھا ایک ہمسفر،
اس نے تمہیں میری زندگی بنا دیا۔

تم ساتھ ہو تو سب کچھ ہے،
تم نہ ہو تو کچھ بھی نہیں،
میری ہر خوشی تم سے ہے،
تم بن زندگی زندگی نہیں۔

ایک دن ایسا بھی آئے گا،
جب تم میرا نام سجاؤ گی،
میری دنیا میری بانہوں میں،
تم دلہن بن کر آؤ گی۔

میں وعدہ کرتا ہوں تم سے،
ہر خوشی تمہارے نام کروں گا،
جو بھی ہو زندگی میں آگے،
ہر پل تمہارے ساتھ چلوں گا۔

تم میری محبت، تم میری عادت،
تم ہی میری عبادت ہو،
اس دنیا کی سب سے خوبصورت،
میری ہونے والی بیوی ہو۔
            `;
            
            const typedTextElement = document.getElementById('typed-text');
            typedTextElement.setAttribute('dir', 'rtl');
            typedTextElement.style.textAlign = 'right';

            new Typed('#typed-text', {
                strings: [letterContent],
                typeSpeed: 30,
                showCursor: true,
                cursorChar: '|'
            });

            // Create floating elements
            const floatingElements = [
                { type: 'heart', color: '#ff6b8a', size: '20px' },
                { type: 'heart', color: '#f48fb1', size: '30px' },
                { type: 'star', color: '#ffd54f', size: '25px' },
                { type: 'star', color: '#ffecb3', size: '15px' },
                { type: 'teddy', emoji: '🧸', size: '30px' },
                { type: 'sparkle', emoji: '✨', size: '25px' },
                { type: 'sparkle', emoji: '✨', size: '20px' },
                { type: 'heart', color: '#ff6b8a', size: '25px' },
                { type: 'star', color: '#ffd54f', size: '20px' },
                { type: 'teddy', emoji: '🧸', size: '25px' }
            ];

            floatingElements.forEach((element, index) => {
                createFloatingElement(element, index);
            });

            // Cursor effect
            if (supportsHover) {
                document.addEventListener('mousemove', createCursorEffect);
            }

            // Music controls
            const musicToggle = document.getElementById('music-toggle');
            const musicIcon = document.getElementById('music-icon');
            const backgroundMusic = document.getElementById('background-music');
            let isMusicPlaying = false;
            let savedTimeApplied = false;
            let shouldKeepPlaying = localStorage.getItem(AUDIO_STORAGE_KEYS.playing) !== 'false';

            function persistAudioState() {
                localStorage.setItem(AUDIO_STORAGE_KEYS.time, String(backgroundMusic.currentTime || 0));
                localStorage.setItem(AUDIO_STORAGE_KEYS.volume, String(backgroundMusic.volume));
                localStorage.setItem(AUDIO_STORAGE_KEYS.playing, String(shouldKeepPlaying));
            }

            function syncMusicIcon() {
                isMusicPlaying = !backgroundMusic.paused;
                musicIcon.classList.toggle('fa-volume-up', isMusicPlaying);
                musicIcon.classList.toggle('fa-volume-mute', !isMusicPlaying);
            }

            function tryResumeAudio() {
                if (!shouldKeepPlaying) {
                    syncMusicIcon();
                    return;
                }

                backgroundMusic.play()
                    .then(() => {
                        shouldKeepPlaying = true;
                        syncMusicIcon();
                        persistAudioState();
                    })
                    .catch(error => {
                        console.log('Audio play error:', error);
                        syncMusicIcon();
                    });
            }

            function enableAudioOnFirstInteraction() {
                const unlockAudio = () => {
                    if (!backgroundMusic.paused) {
                        return;
                    }
                    shouldKeepPlaying = true;
                    tryResumeAudio();
                };

                ['click', 'touchstart', 'keydown'].forEach((eventName) => {
                    document.addEventListener(eventName, unlockAudio, { once: true, passive: true });
                });
            }

            const savedVolume = localStorage.getItem(AUDIO_STORAGE_KEYS.volume);
            backgroundMusic.volume = savedVolume ? Number(savedVolume) : 0.5;

            backgroundMusic.addEventListener('loadedmetadata', () => {
                if (savedTimeApplied) {
                    return;
                }

                const savedTime = Number(localStorage.getItem(AUDIO_STORAGE_KEYS.time) || 0);
                if (savedTime > 0 && savedTime < backgroundMusic.duration) {
                    backgroundMusic.currentTime = savedTime;
                }
                savedTimeApplied = true;
                tryResumeAudio();
            });

            backgroundMusic.addEventListener('play', syncMusicIcon);
            backgroundMusic.addEventListener('pause', syncMusicIcon);
            backgroundMusic.addEventListener('timeupdate', persistAudioState);
            window.addEventListener('pagehide', persistAudioState);
            window.addEventListener('beforeunload', persistAudioState);
            tryResumeAudio();
            enableAudioOnFirstInteraction();

            musicToggle.addEventListener('click', function() {
                if (isMusicPlaying) {
                    shouldKeepPlaying = false;
                    backgroundMusic.pause();
                } else {
                    shouldKeepPlaying = true;
                    backgroundMusic.play().catch(e => console.log('Audio play error:', e));
                }
                syncMusicIcon();
                persistAudioState();
            });

            // Helper Functions
            function createFloatingElement(element, index) {
                const floatingElement = document.createElement('div');
                floatingElement.classList.add('floating-element');
                
                if (element.emoji) {
                    floatingElement.textContent = element.emoji;
                    floatingElement.style.fontSize = element.size;
                } else if (element.type === 'heart') {
                    floatingElement.innerHTML = '<i class="fas fa-heart"></i>';
                    floatingElement.style.color = element.color;
                    floatingElement.style.fontSize = element.size;
                } else if (element.type === 'star') {
                    floatingElement.innerHTML = '<i class="fas fa-star"></i>';
                    floatingElement.style.color = element.color;
                    floatingElement.style.fontSize = element.size;
                }
                
                // Random positioning
                const randomX = Math.random() * window.innerWidth;
                const randomY = Math.random() * window.innerHeight;
                floatingElement.style.left = `${randomX}px`;
                floatingElement.style.top = `${randomY}px`;
                
                // Animation duration and delay
                const duration = 5 + Math.random() * 10;
                const delay = Math.random() * 5;
                floatingElement.style.animationDuration = `${duration}s`;
                floatingElement.style.animationDelay = `${delay}s`;
                
                document.body.appendChild(floatingElement);
            }

            function createCursorEffect(e) {
                const cursorEffect = document.createElement('div');
                cursorEffect.classList.add('cursor-effect');
                cursorEffect.style.left = `${e.pageX}px`;
                cursorEffect.style.top = `${e.pageY}px`;
                document.body.appendChild(cursorEffect);
                
                setTimeout(() => {
                    cursorEffect.style.opacity = 1;
                    cursorEffect.style.transform = `translate(-50%, -50%) scale(${Math.random() * 0.5 + 0.5})`;
                    
                    setTimeout(() => {
                        cursorEffect.style.opacity = 0;
                        setTimeout(() => {
                            cursorEffect.remove();
                        }, 500);
                    }, 300);
                }, 10);
            }
        });
    </script>
</body>
</html>
